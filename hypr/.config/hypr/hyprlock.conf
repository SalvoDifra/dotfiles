general {
    hide_cursor = true
    grace = 5
    ignore_empty_input = true
    immediate_render = false
}

background {
    monitor =
    path = $HOME/Pictures/Wallpapers/023.jpg
    # Blur profondo stile macOS/Waybar
    blur_passes = 4 
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 300, 45
    outline_thickness = 2
    rounding = 12
    outer_color = rgb(D8E2DC) 
    inner_color = rgba(40, 40, 40, 0.7)
    font_color = rgb(D8E2DC) 
    fail_color = rgb(cc241d) 
    capslock_color = rgb(fe8019)
    fade_on_empty = false
    placeholder_text = <i>Enter password...</i>
    
    # Font della Waybar
    font_family = "SF Pro Display", "JetBrainsMono Nerd Font"
    position = 0, -40  
    halign = center
    valign = center
}

# DATA
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = rgb(D8E2DC) 
    font_size = 22
    font_family = "SF Pro Display", "JetBrainsMono Nerd Font"
    position = 0, 50
    halign = center
    valign = center
}

# ORA
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(D8E2DC) 
    font_size = 95
    font_family = "SF Pro Display", "JetBrainsMono Nerd Font"
    position = 0, 160
    halign = center
    valign = center
}

# LAYOUT TASTIERA
label {
    monitor =
    text = $LAYOUT
    color = rgb(D8E2DC) 
    font_size = 10
    font_family = "SF Pro Display", "JetBrainsMono Nerd Font"
    position = 0, -95
    halign = center
    valign = center
}

# SPOTIFY STATUS
label {
    monitor =
    text = cmd[update:3000] pidof spotify > /dev/null && echo "<span foreground='##D8E2DC' size='14000'> </span>$(playerctl -p spotify metadata xesam:title) - $(playerctl -p spotify metadata xesam:artist)"
    color = rgb(D8E2DC) 
    font_size = 14
    font_family = "SF Pro Display", "JetBrainsMono Nerd Font"
    position = 0, -400
    halign = center
    valign = center
}

# UPTIME
label {
    monitor =
    text = cmd[update:60] uptime -p
    color = rgb(D8E2DC) 
    font_size = 10
    font_family = "SF Pro Display", "JetBrainsMono Nerd Font"
    position = 0, -440
    halign = center
    valign = center
