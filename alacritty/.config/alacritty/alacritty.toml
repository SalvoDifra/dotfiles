
[font]
builtin_box_drawing = true
size = 13

[font.bold]
#family = "CodeNewRoman Nerd Font Mono"
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
#family = "CodeNewRoman Nerd Font Mono"
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
#family = "CodeNewRoman Nerd Font Mono"
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
#family = "CodeNewRoman Nerd Font Mono"
family = "JetBrainsMono Nerd Font"
style = "Regular"

[[hints.enabled]]
command = "xdg-open"
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mode = "~Vi"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "NumpadAdd"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "NumpadSubtract"
mods = "Control"

[window]
dynamic_title = true
decorations = "None"
opacity = 0.80
blur = true
padding = { x = 17, y = 17 }
dimensions = { columns = 80, lines = 28 }


#[colors.primary]
#background = "#0d0d0d" # Nero quasi assoluto per far risaltare il bianco
#foreground = "#e0e0e0" # Bianco neutro per il testo normale

#[colors.normal]
# Le cartelle di solito usano il Blue ANSI. Lo mappiamo su un Bianco brillante e Bold.
#black   = "#1a1a1a"
#red     = "#999999" # File compressi/archivi (Grigio medio)
#green   = "#ffffff" # Eseguibili (Bianco puro)
#yellow  = "#808080"
#blue    = "#ffffff" # Cartelle (Bianco puro - spiccheranno col Bold)
#magenta = "#b3b3b3"
#cyan    = "#a0a0a0"
#white   = "#d1d1d1" # Testo standard (Files comuni)

#[colors.bright]
#black   = "#4d4d4d"
#red     = "#777777"
#green   = "#ffffff"
#yellow  = "#ffffff"
#blue    = "#ffffff"
#magenta = "#ffffff"
#cyan    = "#ffffff"
#white   = "#ffffff"

# --- COLORI ESTRATTI DALL'IMMAGINE (REVISIONATI) ---
[colors.primary]
background = "#000000" # Nero Assoluto
foreground = "#D8E2DC" # Bianco Nuvola

[colors.cursor]
text = "#000000"
cursor = "#ffffff" # Cursore Bianco (rimosso il verde)

[colors.normal]
black   = "#1A1B26"
red     = "#FF5D5D" # Rosso caldo
green   = "#72921C" # Verde prato
yellow  = "#FFC300" # Giallo sole
blue    = "#3A86FF" # Blu acceso (più visibile delle cartelle)
magenta = "#957FB8" # Lilla nuvola
cyan    = "#4E949F" # Turchese acqua
white   = "#ACB0D0" # Grigio nebbia

[colors.bright]
black   = "#444B6A"
red     = "#FF5D5D"
green   = "#9BC037" # Verde neon per eseguibili
yellow  = "#FFD700"
blue    = "#5DA9FF" # Azzurro brillante per cartelle bold
magenta = "#CBA6F7"
cyan    = "#7DCFFF"
white   = "#FFFFFF"
